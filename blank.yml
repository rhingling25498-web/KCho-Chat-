name: Build KCho Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build KCho Chat Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Flutter ZIP
        shell: bash
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'KCho-Chat-APK-Build-Package-FIXED-minSdk24*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: KCho Chat ZIP was not found in repository root."
            ls -la
            exit 1
          fi
          echo "Using $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Flutter Project
        shell: bash
        run: |
          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml was not found inside the ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KCho-Chat-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
