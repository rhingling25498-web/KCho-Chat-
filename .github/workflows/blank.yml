
name: Build KCho Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build KCho Chat Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        shell: bash
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'KCho-Chat-APK-Build-Package-FIXED-minSdk24*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Flutter ZIP file not found!"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Flutter Project
        shell: bash
        run: |
          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP!"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Check Android Min SDK
        shell: bash
        run: |
          grep -n -E 'minSdk|minSdkVersion' android/app/build.gradle || true
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KCho-Chat-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
